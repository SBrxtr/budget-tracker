<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brixter's Website</title>
<style>
  :root {
    --bg: #f4f7fb;
    --card: #ffffff;
    --text: #172033;
    --muted: #697386;
    --line: #e4e8ef;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --shadow: 0 8px 25px rgba(23,32,51,.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  nav {
    background: var(--card);
    box-shadow: var(--shadow);
    padding: 14px 20px;
    font-weight: 800;
    font-size: 18px;
  }
  nav span { color: var(--primary); }
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 16px;
  }
  .hero {
    text-align: center;
    max-width: 560px;
  }
  .hero h1 { font-size: 34px; margin: 0 0 10px; }
  .hero p { color: var(--muted); margin: 0 0 24px; font-size: 16px; }
  .btn-grid {
    display: grid;
    gap: 12px;
    justify-items: center;
  }
  .tile-btn {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    padding: 14px 26px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(37,99,235,.25);
    transition: background .15s, transform .15s;
  }
  .tile-btn:hover { background: var(--primary-dark); transform: translateY(-2px); }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 16px;
  }
  footer a { color: var(--primary); text-decoration: none; }
</style>
</head>
<body>
<nav>Brixter<span>'s</span> Site</nav>

<main>
  <div class="hero">
    <h1>Welcome 👋</h1>
    <p>A small collection of my personal web apps. Pick one to get started.</p>
    <div class="btn-grid">
      <a class="tile-btn" href="Budget Tracker/my_budget_tracker.html">💰 My Budget Tracker</a>
      <a class="tile-btn" style="background:#eef2f7;color:var(--text);box-shadow:none" href="Budget Tracker/my_budget_tracker_mobile.html">📱 Budget Tracker (Mobile)</a>
    </div>
  </div>
</main>

<footer>
  Created by: <a href="https://www.facebook.com/brxtrsmn" target="_blank">Brixter Semana</a>
</footer>
</body>
</html>
