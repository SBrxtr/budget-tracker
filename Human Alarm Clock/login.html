<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Human Alarm Clock Login</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;color:#172033;font-family:system-ui,sans-serif;padding:20px}main{width:min(420px,100%);padding:28px;background:white;border-radius:18px;box-shadow:0 12px 35px #1720331a}h1{font-size:24px}p{color:#697386}label{display:block;margin:15px 0 6px;font-weight:700;font-size:13px}input,select{width:100%;padding:12px;border:1px solid #e4e8ef;border-radius:9px;font:inherit}button{width:100%;padding:13px;margin-top:20px;border:0;border-radius:9px;background:#2563eb;color:white;font-weight:800;font-size:15px}#error{color:#b91c1c;min-height:20px;font-size:13px}</style></head><body><main><h1>⏰ Human Alarm Clock</h1><p>Sign in to continue.</p><form id="f"><label for="role">Account Type</label><select id="role"><option value="client">Client</option><option value="admin">Admin</option></select><label for="email">Email Address</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="b">Sign In</button><p id="error" role="alert"></p></form><p><a href="../index.html">Back to Home</a></p></main><script type="module">
import{auth,getUserRole}from"./firebase-config.js";import{signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
const f=document.getElementById("f"),b=document.getElementById("b"),err=document.getElementById("error"),dest=r=>r==="admin"?"admin.html":"client.html";
onAuthStateChanged(auth,u=>{if(u&&getUserRole(u))location.replace(dest(getUserRole(u)))});
f.addEventListener("submit",async e=>{e.preventDefault();err.textContent="";b.disabled=true;b.textContent="Signing in…";try{const c=await signInWithEmailAndPassword(auth,email.value.trim(),password.value),r=getUserRole(c.user);if(!r){await signOut(auth);throw Error("This account is not authorized.");}if(r!==role.value){await signOut(auth);throw Error("Select the correct account type.");}location.replace(dest(r));}catch(x){err.textContent=x.code==="auth/invalid-credential"?"Incorrect email or password.":x.message||"Sign-in failed.";}finally{b.disabled=false;b.textContent="Sign In";}});
</script></body></html>
