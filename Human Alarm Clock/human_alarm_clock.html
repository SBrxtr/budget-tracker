<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Human Alarm Clock</title>
<style>
  :root {
    --bg: #f4f7fb;
    --card: #ffffff;
    --text: #172033;
    --muted: #697386;
    --line: #e4e8ef;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --danger: #dc2626;
    --success: #16803c;
    --shadow: 0 8px 25px rgba(23,32,51,.08);
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  .app { width: min(760px, 100%); margin: 0 auto; padding: 20px 14px 40px; }
  header { margin-bottom: 18px; }
  h1 { margin: 0 0 5px; font-size: 28px; }
  .subtitle { margin: 0; color: var(--muted); }
  .card { background: var(--card); border-radius: 18px; padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card h2 { margin: 0 0 12px; font-size: 19px; }
  .note { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
  a.back { display: inline-block; margin-top: 10px; color: var(--primary); font-weight: 700; font-size: 14px; text-decoration: none; }
  .btn-grid { display: grid; gap: 12px; justify-items: center; margin-top: 18px; }
  .tile-btn { display: inline-block; background: var(--primary); color: #fff; text-decoration: none; font-weight: 700; font-size: 15px; padding: 14px 26px; border-radius: 12px; box-shadow: 0 8px 20px rgba(37,99,235,.25); transition: background .15s, transform .15s; }
  .tile-btn:hover { background: var(--primary-dark); transform: translateY(-2px); }
</style>
</head>
<body>
<header>
  <h1>⏰ Human Alarm Clock</h1>
  <p class="subtitle">The admin schedules the client's wake-up calls.</p>
  <div class="btn-grid">
    <a class="tile-btn" href="admin.html">🛡 Admin</a>
    <a class="tile-btn" href="client.html">🙂 Client</a>
  </div>
  <p style="margin:10px 0 0"><a href="../index.html" class="secondary" style="text-decoration:none;display:inline-block;padding:9px 14px;border-radius:10px;font-weight:700;font-size:14px">← Back to Home</a></p>
</header>
</body>
</html>
