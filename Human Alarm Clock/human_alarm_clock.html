<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Human Alarm Clock</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#697386;--line:#e4e8ef;--primary:#2563eb;--primary-dark:#1d4ed8;--danger:#dc2626;--shadow:0 8px 25px rgba(23,32,51,.08)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.app{width:min(860px,100%);margin:0 auto;padding:20px 14px 60px}
header{margin-bottom:16px}
h1{margin:0 0 5px;font-size:26px}
.subtitle{margin:0;color:var(--muted)}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 12px;font-size:17px}
button{border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer}
.primary{background:var(--primary);color:#fff}.primary:hover{background:var(--primary-dark)}
.secondary{background:#eef2f7;color:var(--text)}
a.back{display:inline-block;margin-top:12px;color:var(--primary);font-size:14px;font-weight:700;text-decoration:none}
.alarm-cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.alarm-month{font-weight:800;font-size:19px}
.alarm-nav{background:#eef2f7;width:36px;height:36px;padding:0;font-size:22px;line-height:1}
.alarm-weekdays,.alarm-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.alarm-weekdays{margin-bottom:6px}
.alarm-weekdays div{text-align:center;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase}
.alarm-cell{position:relative;min-width:0;min-height:92px;padding:26px 5px 7px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;border-radius:10px;background:#f8fafc;border:1px solid var(--line);font-size:14px;font-weight:700;color:var(--text)}
.alarm-cell.out{background:transparent;border-color:transparent}
.alarm-cell.alarm-red{background:#fee2e2;border-color:#fecaca;color:#b91c1c}\n.alarm-cell.alarm-green{background:#dcfce7;border-color:#86efac;color:#166534}\n.alarm-cell.alarm-note{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}\n.alarm-cell{cursor:pointer;transition:background .15s,border-color .15s,transform .15s}\n.alarm-cell:not(.out):hover{border-color:var(--primary);transform:translateY(-1px)}\n.alarm-cell.out{cursor:default;pointer-events:none}\n.alarm-cell-label{line-height:1.25}\n.alarm-paid{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:6px;font-size:10px;font-weight:700;color:inherit}\n.alarm-paid input{width:14px;height:14px;margin:0;accent-color:#16a34a;cursor:pointer}\n.alarm-cell-note{font-size:10px;font-weight:700;margin-top:7px;text-align:center;overflow-wrap:anywhere}
.alarm-cell.alarm-today{outline:2px solid var(--primary);outline-offset:-2px}
.alarm-cell-label{font-size:10px;font-weight:800;margin-top:7px;text-align:center;overflow-wrap:anywhere}
.cell-actions{position:absolute;right:4px;top:4px;display:flex;gap:3px}
.icon-btn{width:25px;height:25px;padding:4px;display:inline-flex;align-items:center;justify-content:center;background:#eef2f7;color:#334155;border-radius:7px}
.icon-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.add{background:#dbeafe;color:#1d4ed8}
.icon-btn.remove{background:#fee2e2;color:#b91c1c}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.42);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}
.modal-backdrop.open{display:flex}
.modal{width:min(420px,100%);background:#fff;border-radius:16px;padding:20px;box-shadow:0 18px 50px rgba(15,23,42,.2)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.modal h2{margin:0;font-size:19px}
.close-btn{width:32px;height:32px;padding:0;background:#eef2f7;font-size:20px;line-height:1}
.modal-date{margin:0 0 16px;color:var(--muted);font-size:13px}
.modal label{display:block;font-size:13px;font-weight:700;margin:0 0 7px}
.modal select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;background:#fff;color:var(--text);outline:none}
.modal select:focus,.modal textarea:focus{border-color:var(--primary)}\n.modal textarea{display:none;width:100%;min-height:100px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;color:var(--text);outline:none;margin-top:10px}\n.modal textarea.visible{display:block}
.service-price{margin:12px 0 0;font-size:14px;font-weight:700;color:var(--muted);min-height:21px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
@media(max-width:560px){.app{padding:16px 9px 40px}.card{padding:12px}.alarm-weekdays,.alarm-grid{gap:3px}.alarm-cell{min-height:76px;padding-top:25px;font-size:12px}.alarm-cell-label{font-size:9px}.icon-btn{width:22px;height:22px;padding:3px}.cell-actions{right:2px;top:3px;gap:2px}}
</style>
</head>
<body>
<main class="app">
<header>
  <h1>⏰ Human Alarm Clock</h1>
  <p class="subtitle">Manage service levels for each calendar date.</p>
  <a href="../index.html" class="back">← Back to Home</a>
</header>
<section class="card">
  <h2>Calendar</h2>
  <div id="alarmCalendar"></div>
</section>
</main>
<div class="modal-backdrop" id="labelModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Add Label</h2>
      <button type="button" class="close-btn" id="closeModal" aria-label="Close">×</button>
    </div>
    <p class="modal-date" id="modalDate">Selected date</p>
    <label for="serviceLevel">Service Level</label>
    <select id="serviceLevel">
      <option value="">Select Service Level</option>
      <option value="tier1">Tier 1</option>
      <option value="tier2">Tier 2</option>
      <option value="tier3">Tier 3</option>
    </select>
    <p class="service-price" id="servicePrice">Select Service Level</p>
    <div class="modal-actions">
      <button type="button" class="secondary" id="cancelModal">Cancel</button>
      <button type="button" class="primary" id="saveLabel">Add Label</button>
    </div>
  </div>
</div>
<script src="human_alarm_clock.js"></script>
</body>
</html>
